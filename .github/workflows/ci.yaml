name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup .NET 8
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '8.0.x'

            - name: Restore
              run: dotnet restore Healthcare.API.sln

            - name: Build
              run: dotnet build Healthcare.API.sln --no-restore --configuration Release

            - name: Test
              run: dotnet test Healthcare.UnitTest/Healthcare.UnitTest.csproj --no-build --configuration Release --logger trx --results-directory TestResults

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: test-results
                path: TestResults
        
    publish-image:
        needs: build-and-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/arebhysri/healthcare-api:latest
                      ghcr.io/arebhysri/healthcare-api:${{ github.sha }}


